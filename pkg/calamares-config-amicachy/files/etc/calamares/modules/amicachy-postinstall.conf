# SPDX-License-Identifier: CC0-1.0
#
# Data for the amicachy-postinstall job. F3 ships only the 'profiles'
# sub-job: it writes the systemd-boot loader.conf + entries with amiprofile=,
# the contractual API amilaunch.sh dispatches on (inventory §6).
#
# Source of truth ported from tools/installer/resources.py:11-44, but with the
# *live* silenced cmdline (00-install.conf), not the loglevel=3 one in
# resources.py (decision F0 #5 / inventory §6 divergence note).
---
# Profile booted by default (F3 has no QML profile selector yet — that's F6).
default_profile: "classic_68k"

# Always written regardless of selection (lets the user reach the Asset
# Manager after first boot). Matches resources.py ALWAYS_INSTALL_ENTRIES.
always_install:
    - "asset_manager"

loader_timeout: 5

# Common kernel cmdline, silenced for the appliance feel. amiprofile=<id> and
# any per-profile extra are appended per entry by main.py. The archiso-only
# bits (archisobasedir/archisolabel) are dropped; root= points at the
# installed AMICACHY label.
cmdline_base: "root=LABEL=AMICACHY rw quiet splash loglevel=0 rd.systemd.show_status=false rd.udev.log_priority=3 udev.log_priority=3 systemd.show_status=false fbcon=nodefer logo.nologo vt.global_cursor_default=0 nvidia-drm.modeset=1 nvidia-drm.fbdev=1 nouveau.modeset=0 module_blacklist=nouveau"

profiles:
    classic_68k:
        filename: "01-classic-68k.conf"
        title: "AmiCachy - Classic 68k"
        extra_cmdline: "mitigations=off nowatchdog"
    ppc_nitro:
        filename: "02-ppc-nitro.conf"
        title: "AmiCachy - PPC Nitro"
        extra_cmdline: "mitigations=off nowatchdog"
    dev_station:
        filename: "03-dev-station.conf"
        title: "AmiCachy - Dev Station"
        extra_cmdline: ""
    asset_manager:
        filename: "04-asset-manager.conf"
        title: "AmiCachy - Asset Manager"
        extra_cmdline: ""
