#
# AmiCachy partition module config. The automatic layout creates a fixed-size
# AMICACHY root plus an AMIGADATA data partition that takes the rest:
#   - T1 (empty disk): "Erase disk" → ESP + AMICACHY (/, 20G) + AMIGADATA
#     (/home/amiga/Amiga, remaining space).
#   - T2/T3 (dual-boot, F4): "Install alongside" / "Replace a partition" appear
#     automatically; Calamares carves the same AMICACHY + AMIGADATA pair into the
#     free space / replaced partition.
#
# WHY A SEPARATE AMIGADATA (decided 2026-06-14): the user's Amiga library (HDFs,
# ROMs, assets) is the bulk of the data and lives on AMIGADATA at /home/amiga/Amiga.
# Keeping it on its own partition means a later REINSTALL can "Replace" only the
# AMICACHY root and keep the library intact. AMICACHY is a fixed 20G (ample for the
# ~7G squashfs install + updates/logs/cache); AMIGADATA takes everything else, so
# it is the big one on any real disk. Users who prefer a single partition can pick
# "Manual". (A friendly in-installer on/off toggle would need a custom C++ Calamares
# page — deferred; see tasks/calamares-f4-plan.md.)
#
# NOTE: the *pendrive* images use a different mechanism for the same idea — a
# writable AMICACHY_DATA partition (grown by amicachy-grow-data) because their base
# squashfs is read-only. That is unrelated to this disk-install layout.
#
# GOTCHA: because AMIGADATA mounts at /home/amiga/Amiga, /home/amiga exists before
# Calamares' useradd, so useradd -m skips skel — amicachy-postinstall copies skel
# back in (F3 gotcha #5).
#
# ESP REUSE (F4 risk #1): efiSystemPartition is the mount point Calamares uses
# for the EFI System Partition. On a dual-boot disk Calamares detects the
# existing ESP, mounts it here and does NOT reformat it, preserving Windows'
# bootmgfw.efi / the other Linux's loader. efiSystemPartitionSize/Name only
# apply when *creating* a new ESP (erase mode), and are ignored on reuse.
# Verify with dev/dualboot-vm/scripts/verify-untouched.sh that the ESP is not
# reformatted (only AmiCachy's own files added).
---
efiSystemPartition:        "/boot"
# Doubles as (a) the size of a newly created ESP in erase mode (T1) and (b) the
# "recommended" threshold Calamares enforces to *reuse* an existing ESP in
# alongside/replace (F4). 512M blocked T3: Debian's ESP is 487 MiB < 512 → "EFI
# system partition is too small (recommended 512 MiB)" and Next stayed disabled.
# 300M (Calamares' own default) accepts the common 300/487/512 MiB ESPs and is
# ample for AmiCachy's single small kernel (autodetect initramfs ~30-60 MiB).
# NOTE: Windows' ~100 MiB ESP is still below this AND physically too small to
# also hold our kernel+initramfs — T2 needs a dedicated approach (XBOOTLDR or
# similar), tracked in tasks/calamares-f4-plan.md, not just a lower threshold.
efiSystemPartitionSize:    300M
efiSystemPartitionName:    "AMIEFI"

userSwapChoices:
    - none

drawNestedPartitions:       false
alwaysShowPartitionLabels:  true

# No forced choice: "Erase disk" (T1), "Install alongside" and "Replace a
# partition" (T2/T3) appear automatically depending on the disk's contents.
# Forcing "erase" here would have wiped any pre-existing OS — the exact bug in
# the old PySide6 installer that this whole migration exists to fix.
initialPartitioningChoice:  none
initialSwapChoice:          none

defaultFileSystemType:      "ext4"
availableFileSystemTypes:   [ "ext4" ]
defaultPartitionTableType:  gpt

# Auto layout. The ESP is created/reused implicitly from efiSystemPartition*
# above. AMICACHY is a fixed-size root; AMIGADATA is last so it takes all the
# remaining space (the bulk, for the Amiga library). In dual-boot (alongside/
# replace) Calamares carves this same pair into the free hole.
partitionLayout:
    - name:       "AMICACHY"
      filesystem: "ext4"
      mountPoint: "/"
      size:       20G
    - name:       "AMIGADATA"
      filesystem: "ext4"
      mountPoint: "/home/amiga/Amiga"
      size:       100%
