#
# AmiCachy partition module config. Supports both:
#   - T1 (empty disk): user picks "Erase disk" → the partitionLayout below
#     applies (GPT: ESP + ext4 AMICACHY root + ext4 AMIGADATA data), replicating
#     tools/installer/backend.py::partition_disk.
#   - T2/T3 (dual-boot, F4): on a disk that already has Windows/Linux, Calamares
#     shows "Install alongside" and "Replace a partition" automatically. In
#     those modes the partitionLayout does NOT apply — Calamares installs a
#     single ext4 root in the free space / replaced partition, and AMIGADATA is
#     a plain directory under it (populated from skel by amicachy-postinstall).
#
# ESP REUSE (F4 risk #1): efiSystemPartition is the mount point Calamares uses
# for the EFI System Partition. On a dual-boot disk Calamares detects the
# existing ESP, mounts it here and does NOT reformat it, preserving Windows'
# bootmgfw.efi / the other Linux's loader. efiSystemPartitionSize/Name only
# apply when *creating* a new ESP (erase mode), and are ignored on reuse.
# Verify with dev/dualboot-vm/scripts/verify-untouched.sh that the ESP is not
# reformatted (only AmiCachy's own files added).
---
efiSystemPartition:        "/boot"
efiSystemPartitionSize:    512M
efiSystemPartitionName:    "AMIEFI"

userSwapChoices:
    - none

drawNestedPartitions:       false
alwaysShowPartitionLabels:  true

# No forced choice: "Erase disk" (T1), "Install alongside" and "Replace a
# partition" (T2/T3) appear automatically depending on the disk's contents.
# Forcing "erase" here would have wiped any pre-existing OS — the exact bug in
# the old PySide6 installer that this whole migration exists to fix.
initialPartitioningChoice:  none
initialSwapChoice:          none

defaultFileSystemType:      "ext4"
availableFileSystemTypes:   [ "ext4" ]
defaultPartitionTableType:  gpt

# Auto layout applied on "erase disk". The ESP is created implicitly from
# efiSystemPartition* above; these are the partitions after it. The last
# entry takes the remaining space.
partitionLayout:
    - name:       "AMICACHY"
      filesystem: "ext4"
      mountPoint: "/"
      size:       60%
    - name:       "AMIGADATA"
      filesystem: "ext4"
      mountPoint: "/home/amiga/Amiga"
      size:       100%
