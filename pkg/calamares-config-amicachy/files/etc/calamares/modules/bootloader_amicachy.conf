#
# AmiCachy uses systemd-boot (NOT grub) — the amiprofile= boot entries are
# the contractual API of amilaunch.sh. This module just installs the
# systemd-boot EFI binary (bootctl install) and a baseline loader.conf;
# amicachy-postinstall runs AFTER it and overwrites loader.conf + entries
# with the real AmiCachy profiles (inventory §9 risk #1 — ordering).
---
efiBootLoader: "systemd-boot"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
    - "timeout 5"
    - "console-mode max"

kernelParams: [ "quiet" ]

efiBootMgr: "efibootmgr"
efiBootloaderId: "AmiCachy"

# amicachy-postinstall installs the Mac removable-path fallback in F6; do not
# let the bootloader module write its own generic fallback.
installEFIFallback: false
