#
# Deploy the precompiled AmiCachy *target* rootfs (decision F0 #1 + the
# "separate clean squashfs" scope decision for F3). The squashfs is built by
# tools/build_target_rootfs.sh and placed at /usr/share/amicachy/target.sfs
# inside the live ISO. It already contains the kernel + initramfs under /boot
# (which land on the ESP, mounted at /boot) and the amicachy-base package.
---
unpack:
    -   source:      "/usr/share/amicachy/target.sfs"
        sourcefs:    "squashfs"
        destination: ""
