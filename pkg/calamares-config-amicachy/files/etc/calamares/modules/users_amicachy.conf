#
# AmiCachy user: the login name is forced to "amiga" (the identity the whole
# system is built around — autologin override, ~/.bash_profile, amilaunch).
# On the freshly unpacked target the first created user gets UID 1000
# (inventory §9 risk: amiga must be 1000). Autologin in the booted system is
# handled by amicachy-base's getty@tty1 override, not by Calamares.
---
defaultGroups:
    - wheel
    - audio
    - video
    - input

doAutologin:     true

sudoersGroup:    wheel

# AmiCachy is a single-user appliance; root stays locked, the amiga user has
# sudo via wheel. The user sets the amiga password on the Users page.
setRootPassword: false
doReusePassword: false

passwordRequirements:
    minLength: -1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "amicachy"
    forbidden_names: [ localhost ]

# Force the login/full name to the AmiCachy identity; the user cannot change
# it (the rest of the system hardcodes "amiga").
presets:
    fullName:
        value: "Amiga User"
        editable: false
    loginName:
        value: "amiga"
        editable: false
