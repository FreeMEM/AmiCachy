#
# "Reiniciar ahora" marcado por defecto (user-checked): tras instalar, lo normal
# es reiniciar al sistema nuevo. Si el usuario lo desmarca, amilaunch muestra una
# pantalla limpia (no la consola de error) — ver run_installer en amilaunch.sh.
---
restartNowMode: user-checked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
