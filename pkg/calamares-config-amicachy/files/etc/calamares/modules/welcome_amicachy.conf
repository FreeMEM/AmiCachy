#
# Como el welcome de CachyOS pero SIN geoip: así el idioma por defecto lo fija
# el LANG del proceso (en_GB.UTF-8, ver amilaunch run_installer) → British
# English, en vez de que geoip lo cambie según la IP.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false
showDonateUrl:       false
requirements:
    requiredStorage:  5.5
    requiredRam:      2.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - ram
