# SPDX-License-Identifier: CC0-1.0
#
# Data for the amicachy-foreign-os job (F4 — dual-boot). It scans the (reused)
# ESP for other OSes and writes systemd-boot chainload entries for them. All
# keys are optional; main.py bakes in the same defaults.
---
# Title for the Windows entry. sd-boot also auto-detects bootmgfw.efi, but an
# explicit Type-1 entry gives a clean title and stable position in the menu.
windows_title: "Windows Boot Manager"

# First numeric prefix for foreign entries. AmiCachy profiles use 01-04, so
# foreign OSes start at 90 to sort below them in the systemd-boot menu.
entry_start: 90

# EFI/<dir> names that are NOT a foreign OS to chainload:
#   systemd   → our own sd-boot
#   boot      → removable-media fallback (EFI/BOOT/BOOTX64.EFI)
#   microsoft → handled specially as Windows above
#   amicachy  → our own EFI id / fallback
#   linux     → UKIs (sd-boot's own auto-entries cover these)
#   tools     → UEFI shell / memtest helpers, not an OS
exclude_dirs: [ "systemd", "boot", "microsoft", "amicachy", "linux", "tools" ]

# EFI binary to chainload inside each vendor dir, most-preferred first. shim
# first (Secure Boot chains through it), else GRUB directly.
loader_preference: [ "shimx64.efi", "grubx64.efi", "shimaa64.efi", "grubaa64.efi", "bootx64.efi" ]

# Pretty titles for known EFI vendor directory names. Unknown dirs fall back to
# the capitalised directory name.
vendor_titles:
    debian:      "Debian"
    ubuntu:      "Ubuntu"
    fedora:      "Fedora"
    arch:        "Arch Linux"
    endeavouros: "EndeavourOS"
    manjaro:     "Manjaro"
    opensuse:    "openSUSE"
    pop:         "Pop!_OS"
    mint:        "Linux Mint"
    rocky:       "Rocky Linux"
    centos:      "CentOS"
    gentoo:      "Gentoo"
    grub:        "GRUB"
