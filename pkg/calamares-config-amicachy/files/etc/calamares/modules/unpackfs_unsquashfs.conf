#
# Deploy the AmiCachy target rootfs by EXTRACTING the squashfs with unsquashfs
# instead of Calamares' unpackfs (which loop-mounts it).
#
# Why: in the archiso live, target.sfs lives on the cowspace overlayfs. The
# kernel refuses to back a loop device with an overlayfs-resident file —
# `mount -o loop` fails with "failed to set up loop device" even though loop
# devices are free — so unpackfs cannot deploy it. unsquashfs reads the file in
# userspace (no loop), which works. squashfs-tools is present in the live (a
# dependency of cachyos-calamares).
#
# dontChroot + ${ROOT}: extract into the mounted target root, including /boot
# (the ESP), exactly where unpackfs' rsync would have put everything.
---
dontChroot: true
timeout: 3600
script:
    - command: "unsquashfs -f -d ${ROOT} /usr/share/amicachy/target.sfs"
      timeout: 3600
i18n:
    name: "Desplegando el sistema AmiCachy"
