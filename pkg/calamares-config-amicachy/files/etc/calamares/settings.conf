# SPDX-License-Identifier: CC0-1.0
#
# AmiCachy Calamares configuration (F3 — happy path T1, empty disk).
#
# Differences from the stock CachyOS settings.conf:
#   - No packagechooser (bootloader/desktop): AmiCachy is systemd-boot only,
#     single fixed profile set.
#   - No netinstall / pacstrap / packages: the system is deployed from a
#     precompiled squashfs (decision F0 #1), not bootstrapped.
#   - Deployment uses a shellprocess running `unsquashfs` instead of the stock
#     `unpackfs`: in the archiso live, target.sfs sits on the cowspace
#     overlayfs and the kernel refuses to loop-mount an overlayfs-resident
#     file, which breaks unpackfs. unsquashfs extracts in userspace (no loop).
#   - Adds the custom amicachy-postinstall job AFTER bootloader, so it can
#     overwrite the loader.conf/entries that the bootloader module writes
#     (inventory §9 risk #1).
#   - Adds amicachy-foreign-os AFTER amicachy-postinstall (F4 — dual-boot): it
#     scans the reused ESP and adds systemd-boot chainload entries for any
#     existing Windows/Linux, without touching loader.conf's default.
#   - The QML pages amicachy-hardware/profiles/addons are F6, not here.
#
# We customise only the modules we must (partition, users, bootloader,
# services-systemd, + the unsquashfs shellprocess) via named instances, so we do
# NOT overwrite cachyos-calamares' own /etc/calamares/modules/*.conf (avoids
# pacman file conflicts). Everything else (locale, keyboard, fstab, mount,
# machineid, networkcfg, localecfg, hwclock, initcpio, welcome, summary,
# finished) uses the stock CachyOS defaults this package depends on.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     amicachy
  module: partition
  config: partition_amicachy.conf
- id:     unsquashfs
  module: shellprocess
  config: unpackfs_unsquashfs.conf
- id:     amicachy
  module: users
  config: users_amicachy.conf
- id:     amicachy
  module: bootloader
  config: bootloader_amicachy.conf
- id:     amicachy
  module: services-systemd
  config: services-systemd_amicachy.conf
- id:     amicachy
  module: locale
  config: locale_amicachy.conf
- id:     amicachy
  module: welcome
  config: welcome_amicachy.conf
- id:     amicachy
  module: finished
  config: finished_amicachy.conf

sequence:
- show:
  - welcome@amicachy
  - locale@amicachy
  - keyboard
  - partition@amicachy
  - users@amicachy
  - summary
- exec:
  - partition@amicachy
  - mount
  - shellprocess@unsquashfs
  - machineid
  - fstab
  - locale@amicachy
  - keyboard
  - localecfg
  - hwclock
  - users@amicachy
  - networkcfg
  - services-systemd@amicachy
  - initcpio
  - bootloader@amicachy
  - amicachy-postinstall
  - amicachy-foreign-os
  - umount
- show:
  - finished@amicachy

branding: amicachy

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
