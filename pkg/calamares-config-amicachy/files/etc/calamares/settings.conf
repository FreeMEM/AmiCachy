# SPDX-License-Identifier: CC0-1.0
#
# AmiCachy Calamares configuration (F3 — happy path T1, empty disk).
#
# Differences from the stock CachyOS settings.conf:
#   - No packagechooser (bootloader/desktop): AmiCachy is systemd-boot only,
#     single fixed profile set.
#   - No netinstall / pacstrap / packages: the system is deployed from a
#     precompiled squashfs via unpackfs (decision F0 #1), not bootstrapped.
#   - Adds the custom amicachy-postinstall job AFTER bootloader, so it can
#     overwrite the loader.conf/entries that the bootloader module writes
#     (inventory §9 risk #1).
#   - The QML pages amicachy-hardware/profiles/addons are F6, not here.
#
# We customise only the modules we must (partition, unpackfs, users,
# bootloader, services-systemd) via named *_amicachy.conf instances, so we do
# NOT overwrite cachyos-calamares' own /etc/calamares/modules/*.conf (avoids
# pacman file conflicts). Everything else (locale, keyboard, fstab, mount,
# machineid, networkcfg, localecfg, hwclock, initcpio, welcome, summary,
# finished) uses the stock CachyOS defaults this package depends on.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     amicachy
  module: partition
  config: partition_amicachy.conf
- id:     amicachy
  module: unpackfs
  config: unpackfs_amicachy.conf
- id:     amicachy
  module: users
  config: users_amicachy.conf
- id:     amicachy
  module: bootloader
  config: bootloader_amicachy.conf
- id:     amicachy
  module: services-systemd
  config: services-systemd_amicachy.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition@amicachy
  - users@amicachy
  - summary
- exec:
  - partition@amicachy
  - mount
  - unpackfs@amicachy
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - hwclock
  - users@amicachy
  - networkcfg
  - services-systemd@amicachy
  - initcpio
  - bootloader@amicachy
  - amicachy-postinstall
  - umount
- show:
  - finished

branding: amicachy

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
