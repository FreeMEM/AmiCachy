[options]
HoldPkg     = pacman glibc
# Architecture is explicit (NOT 'auto') so pacman never accepts a
# higher-arch package out of the host's local cache. With 'auto' on a
# host with AVX-512 (x86_64_v4), x86_64_v4 packages already cached on
# the host would get pulled into the ISO and crash with SIGILL on any
# CPU below v4. List exactly the levels we want to allow.
Architecture = x86_64 x86_64_v3
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Strip noise that bloats the live ISO with files no live user opens:
#   - i18n: keep only es_ES and en_* (others are recreated on disk
#     install when pacman runs there, so installer is unaffected).
#   - man / info / doc / help / X11 locale: not needed in live.
# Estimated saving in the live squashfs: 200-400 MB.
NoExtract = usr/share/locale/* !usr/share/locale/locale.alias !usr/share/locale/es*/* !usr/share/locale/en*/*
NoExtract = usr/share/i18n/locales/* !usr/share/i18n/locales/es_* !usr/share/i18n/locales/en_*
NoExtract = usr/share/X11/locale/*
NoExtract = usr/share/man/* usr/share/info/*
NoExtract = usr/share/doc/* usr/share/gtk-doc/*
NoExtract = usr/share/help/* !usr/share/help/es/* !usr/share/help/C/* !usr/share/help/en/*

# --- CachyOS Repositories (x86-64-v3 optimized: AVX2, BMI1/2, etc.) ---

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
SigLevel = Never

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
SigLevel = Never

# --- Standard Arch Linux Repositories ---

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
