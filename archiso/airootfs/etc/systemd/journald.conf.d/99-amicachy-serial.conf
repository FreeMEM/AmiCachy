# AmiCachy: forward the systemd journal to ttyS1 so a host running the
# ISO under QEMU with `-serial file:journal.log` can post-mortem any boot
# failure that flashes by on screen. Harmless on bare metal: ttyS1
# typically doesn't exist there, journald just drops the writes.
#
# We deliberately do NOT touch the kernel cmdline (no `console=ttyS1`)
# because that would force Plymouth out of graphical mode.
[Journal]
ForwardToConsole=yes
TTYPath=/dev/ttyS1
MaxLevelConsole=debug
