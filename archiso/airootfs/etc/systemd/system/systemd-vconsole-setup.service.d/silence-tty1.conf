[Service]
# vconsole-setup re-runs after plymouth-quit and resets the VT to its
# kernel defaults — that re-enables echo, so any keypress (F5 in
# particular, used to trigger Early Startup Control) shows up as raw
# escape codes (^[[[E) on tty1 during the brief window between Plymouth
# quitting and cage taking over the framebuffer. Reapply -echo and
# clear the residual scrollback after each vconsole-setup run.
ExecStartPost=-/usr/bin/stty -F /dev/tty1 -echo
ExecStartPost=-/bin/sh -c 'printf "\033c\033[2J\033[H" > /dev/tty1'
