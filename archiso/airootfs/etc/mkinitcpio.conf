# nvidia* modules must load before any DRM consumer so KMS is owned by
# the proprietary stack from the very first frame (Plymouth handoff,
# cage). Without these in the initramfs the kernel briefly binds
# simpledrm to the framebuffer and nvidia_drm fights it later.
MODULES=(vmd nvme ahci applesmc hid-apple applespi intel_lpss_pci spi_pxa2xx_platform nvidia nvidia_modeset nvidia_uvm nvidia_drm)
BINARIES=()
FILES=()
HOOKS=(base udev plymouth modconf archiso archiso_loop_mnt kms block filesystems keyboard)
