[options]
HoldPkg     = pacman glibc
# Generic x86-64 only: no AVX2 (v3), no AVX-512 (v4). Boots on any
# 64-bit Intel/AMD CPU since 2003 (Athlon 64 / Pentium 4 era and up).
# Slowest of the three variants but the safest for distribution.
Architecture = x86_64
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- CachyOS base (no -v3 / -znver4 repos: only the generic CachyOS
# packages, which are arch-compatible with any x86_64 CPU) ---

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
SigLevel = Never

# --- Standard Arch Linux Repositories ---

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
